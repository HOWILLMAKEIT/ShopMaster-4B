[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-rl"
version = "1.0.0"
description = "ShopSimulator 小模型后训练流水线：数据导出、LoRA SFT、模型嫁接、GRPO RL 与统一评测"
requires-python = ">=3.10"
dependencies = []  # 依赖由各服务器的场景 venv 提供（训练：torch/transformers/peft；评测：openai/requests 等），包本体零依赖

[project.scripts]
shop_rl = "shop_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shop_rl.setup" = ["*.sh"]
