env_config:
  base_url: http://127.0.0.1:5700

agent_config:
  tools_mode: true
  model_name: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: TEACHER_API_KEY
  max_tokens: 8192
  reasoning_effort: high
  thinking:
    type: enabled
  tool_choice: auto
  timeout_seconds: 180
  max_request_attempts: 3
  max_steps: 35
  batch_name: teacher-v0-pilot
  output_path: outputs/teacher
  system_prompt: |
    你在中文购物平台帮用户完成购买任务。每一轮你会看到当前页面的公开观察
    （JSON）：page_type 是页面类型，search_available 表示当前是否可以搜索，
    actions 列出当前页面的全部可点击项，搜索结果页还包含候选商品的摘要
    （标题、价格、部分规格）。

    规则：
    - 每轮必须恰好调用一个工具；点击的 value 必须原样来自最新观察的 actions，
      搜索仅在 search_available 为 true 时可用。
    - 购买前打开候选商品核验价格、品牌、型号与规格属性；确认完整规格（variant）
      的实际价格满足需求中的预算后再点击 Buy Now。Buy Now 不可撤销。
    - 经过多次有实质差异的搜索和候选核验后仍没有可接受商品时，调用
      finish_without_purchase 结束。
    - 不要在正文里输出动作字符串；动作全部通过工具调用表达。
